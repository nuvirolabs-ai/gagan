# Gagan staging only. This Blueprint deliberately contains only Render free
# service types: one web service and one isolated free Postgres database.
# Render free tier does not support background workers, so mock SAP/outbox and
# other staging jobs run inside the single API instance when enabled below.
services:
  - type: web
    name: gagan-staging-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    # Prisma migrate deploy is safe to repeat: it applies only pending,
    # committed migrations and never resets or pushes the schema.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: gagan-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: https://gagan-staging-admin.vercel.app,http://localhost:5186,http://127.0.0.1:5186
      - key: SMS_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SAP_MODE
        value: mock
      - key: MOCK_OTP
        value: "123456"
      - key: MOCK_PAYMENT_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: OBJECT_STORAGE_ROOT
        value: .data/evidence
      - key: DISABLE_JOBS
        value: "false"
      - key: STAGING_RUN_JOBS_IN_API
        value: "true"
      - key: AGEING_INTERVAL_MINUTES
        value: "60"
      - key: RECOVERY_INTERVAL_MINUTES
        value: "60"
      - key: SAP_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: SAP_OUTBOX_INTERVAL_MINUTES
        value: "5"
      - key: STORE_LOCATION_MAX_ACCURACY_METERS
        value: "50"
      - key: VISIT_VERIFIED_RADIUS_METERS
        value: "150"
      - key: VISIT_REVIEW_RADIUS_METERS
        value: "500"
      - key: LOGISTICS_SERVICE_TOKEN
        generateValue: true

databases:
  - name: gagan-staging-db
    plan: free
    databaseName: gagan_staging
    user: gagan_staging
